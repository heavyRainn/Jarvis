[project]
name = "jarvis-api"
version = "0.1.0"
description = "FastAPI backend for the local JARVIS AI companion (Ollama, PostgreSQL, Whisper STT, Voicebox TTS)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "httpx>=0.28,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "pydantic-settings>=2.8,<3",
    "python-multipart>=0.0.20,<1",
    "faster-whisper>=1.1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.9,<1",
]
